<!DOCTYPE html>
<html>
<head>
    <title>GSMS</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes"/>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-iconic-font/2.2.0/css/material-design-iconic-font.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,300,600,700">

    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/sidebar-menu.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/custom.css') }}">
</head>

<body class="tooltips full-content">

<div class="container">

    <div class="header content rows-content-header">
        <button class="button-menu-mobile show-sidebar">
            <i class="fa fa-bars"></i>
        </button>

        <div class="navbar navbar-default">
            <div class="container">

                <div class="navbar-collapse collapse">
                    <ul class="nav navbar-nav visible-lg visible-md limit-chars">
                        <ul class="breadcrumb">
                            <a href="/">
                                <i class="zmdi zmdi-view-dashboard zmdi-hc-fw" title="Orders"></i>
                            </a>

                            <a href="/manage-product">
                                <i class="zmdi zmdi-assignment zmdi-hc-fw" title="Products"></i>
                            </a>
                        </ul>
                    </ul>
                </div>

            </div>
        </div>
    </div>

    <div class="right content-page">
        <div class="body content rows scroll-y">

            <form class="form-horizontal">

                <div class="box-info full">

                    <h2>Grocery Store Management System</h2>

                    <div class="panel-body pt-0">

                        <div class="row mb-4">
                            <div class="col-sm-12">

                                <a href="/order" class="btn btn-sm btn-primary pull-right ml-3">
                                    New Order
                                </a>

                                <a href="/manage-product" class="btn btn-sm btn-primary pull-right">
                                    Manage Products
                                </a>

                            </div>
                        </div>

                        <table class="table table-bordered">

                            <thead>
                            <tr>
                                <th>Date</th>
                                <th>Order Number</th>
                                <th>Customer Name</th>
                                <th>Total Cost</th>
                            </tr>
                            </thead>

                            <tbody>
                            </tbody>

                        </table>

                    </div>

                </div>

            </form>

        </div>
    </div>

</div>

<script src="{{ url_for('static', filename='js/packages/jquery.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/custom/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/custom/dashboard.js') }}"></script>

</body>
</html>
