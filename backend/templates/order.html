<!DOCTYPE html>
<html>
<head>
    <title>GSMS - New Order</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-iconic-font/2.2.0/css/material-design-iconic-font.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,300,600,700">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar-menu.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>

<body class="tooltips">

<div class="container">

    <div class="header content rows-content-header">
        <button class="button-menu-mobile show-sidebar">
            <i class="fa fa-bars"></i>
        </button>

        <div class="navbar navbar-default">
            <div class="container">
                <div class="navbar-collapse collapse">
                    <ul class="breadcrumb">

                        <a href="/">
                            <i class="zmdi zmdi-view-dashboard zmdi-hc-fw"
                               title="Dashboard"></i>
                        </a>

                        <a href="/manage-product">
                            <i class="zmdi zmdi-assignment zmdi-hc-fw"
                               title="Products"></i>
                        </a>

                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="right content-page">

        <div class="body content rows scroll-y">

            <form>

                <div class="box-info full">

                    <h2>
                        New Order

                        <input
                                type="text"
                                id="customerName"
                                name="customerName"
                                class="form-control"
                                placeholder="Customer Name"
                                style="max-width:230px;float:right;margin-top:-11px">
                    </h2>

                    <div class="row" style="margin-top:10px;margin-bottom:10px;">

                        <div class="col-sm-4">
                            <label>Product</label>
                        </div>

                        <div class="col-sm-3">
                            <label>Price</label>
                        </div>

                        <div class="col-sm-2">
                            <label>Quantity</label>
                        </div>

                        <div class="col-sm-3">
                            <label>Total</label>

                            <button
                                    type="button"
                                    id="addMoreButton"
                                    class="btn btn-primary btn-sm pull-right">
                                Add More
                            </button>

                        </div>

                    </div>

                </div>

                <div class="product-box-extra" id="itemsInOrder"></div>

                <div class="box-info full p-3">

                    <div class="row">

                        <div class="col-sm-9 text-right">
                            <h4>Total</h4>
                        </div>

                        <div class="col-sm-3">

                            <input
                                    type="text"
                                    id="product_grand_total"
                                    id="product_grand_total"
                                    class="product-grand-total"
                                    value="0.0"
                            readonly>

                            <strong>Rs</strong>

                            <button
                                    type="button"
                                    id="saveOrder"
                                    class="btn btn-success btn-sm pull-right">
                                Save
                            </button>

                        </div>

                    </div>

                </div>

            </form>
<div class="product-box hidden">

    <div class="row product-item">

        <div class="col-sm-12">

            <div class="box-info full p-3 mb-3 mt-0">

                <div class="col-sm-4">
                    <select name="product" class="form-control cart-product" style="max-width:250px">
                    </select>
                </div>

                <div class="col-sm-3">
                    <input
                        type="text"
                        id="product_price"
                        name="product_price"
                        class="product-price"
                        value="0.0"
                        readonly>
                </div>

                <div class="col-sm-2">
                    <input
                        type="number"
                        min="1"
                        name="qty"
                        value="1"
                        class="form-control product-qty">
                </div>

                <div class="col-sm-3">
                    <input
                        type="text"
                        id="item_total"
                        name="item_total"
                        class="product-total"
                        value="0.0"
                        readonly>

                    <span> Rs</span>

                    <button
                        type="button"
                        class="btn btn-danger btn-sm pull-right remove-row">
                        Remove
                    </button>
                </div>

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/packages/jquery.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/packages/bootstrap.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/custom/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/custom/order.js') }}"></script>

</body>
</html>
